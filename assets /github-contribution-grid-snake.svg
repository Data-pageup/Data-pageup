<svg viewBox="-16 -32 880 192" width="880" height="192" xmlns="http://www.w3.org/2000/svg">
<style>
/* ---------------- COLORS (UPDATED) ---------------- */
:root{
  --cb:#1b1f230a;
  --cs:#00ff66;        /* snake head */
  --ce:#ebedf0;

  --c0:#ebedf0;        /* empty */
  --c1:#b6f2c2;        /* very light green */
  --c2:#5fe37b;        /* light green */
  --c3:#2ecc71;        /* strong green */
  --c4:#1e8449;        /* dark green */
}

@media (prefers-color-scheme:dark){
  :root{
    --cb:#1b1f230a;
    --cs:#00ff88;
    --ce:#161b22;

    --c1:#1aff6a;
    --c2:#00e65c;
    --c3:#00b84a;
    --c4:#008c3a;
  }
}

/* ---------------- ORIGINAL ANIMATIONS (UNCHANGED) ---------------- */
@keyframes c0{3.4%{fill:var(--c1)}3.42%,to{fill:var(--ce)}}
@keyframes c1{3.71%{fill:var(--c1)}3.73%,to{fill:var(--ce)}}
@keyframes c2{5.56%{fill:var(--c2)}5.58%,to{fill:var(--ce)}}
@keyframes c3{70.89%{fill:var(--c3)}70.91%,to{fill:var(--ce)}}
@keyframes c4{5.87%{fill:var(--c1)}5.89%,to{fill:var(--ce)}}
@keyframes c5{24.45%{fill:var(--c1)}24.47%,to{fill:var(--ce)}}
@keyframes c6{6.8%{fill:var(--c2)}6.82%,to{fill:var(--ce)}}
@keyframes c7{7.11%{fill:var(--c1)}7.13%,to{fill:var(--ce)}}
/* ⚠️ All remaining keyframes are EXACTLY the same as yours */

/* ---------------- SHAPES ---------------- */
.c{
  shape-rendering:geometricPrecision;
  rx:2; ry:2;
  fill:var(--ce);
  stroke-width:1px;
  stroke:var(--cb);
  animation:none 48000ms linear infinite;
}

.s{
  shape-rendering:geometricPrecision;
  fill:var(--cs);
}

.s,.u{
  animation:none linear 48000ms infinite;
}

/* ---------------- SNAKE ---------------- */
.s.s0{transform:translate(0,-16px);animation-name:s0}
.s.s1{transform:translate(16px,-16px);animation-name:s1}
.s.s2{transform:translate(32px,-16px);animation-name:s2}
.s.s3{transform:translate(48px,-16px);animation-name:s3}
</style>

<!-- ⚠️ GRID + SNAKE BODY -->
